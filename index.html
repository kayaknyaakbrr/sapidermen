
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sapidermen - akbrnichol</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050a18;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}
</style>
</head>

<body>
<canvas id="screen"></canvas>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const W = 480;
const H = 800;

canvas.width = W;
canvas.height = H;

ctx.imageSmoothingEnabled = false;

const TAU = Math.PI * 2;

const RED = "#c92135";
const LIGHT_RED = "#ed4350";
const DARK_RED = "#781a2b";
const BLUE = "#174b83";
const DARK_BLUE = "#102d50";
const BLACK = "#101522";
const WHITE = "#f3f1e9";

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;

function smooth(t) {
  t=clamp(t,0,1);
  return t*t*(3-2*t);
}

function rect(x,y,w,h,color) {
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function circle(x,y,r,color) {
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,TAU);
  ctx.fill();
}

function polygon(points,color,stroke=BLACK,width=2) {
  ctx.beginPath();
  points.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p[0],p[1]);
    else ctx.lineTo(p[0],p[1]);
  });
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();

  if(stroke) {
    ctx.strokeStyle=stroke;
    ctx.lineWidth=width;
    ctx.lineJoin="round";
    ctx.stroke();
  }
}

function limb(a,b,color,width=9) {
  ctx.lineCap="square";

  ctx.strokeStyle=BLACK;
  ctx.lineWidth=width+4;
  ctx.beginPath();
  ctx.moveTo(a[0],a[1]);
  ctx.lineTo(b[0],b[1]);
  ctx.stroke();

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.moveTo(a[0],a[1]);
  ctx.lineTo(b[0],b[1]);
  ctx.stroke();
}

// =====================================
// 1. NEW YORK NIGHT SKY
// =====================================

function drawSky(t) {
  const gradient=ctx.createLinearGradient(0,0,0,H);

  gradient.addColorStop(0,"#050b20");
  gradient.addColorStop(.45,"#101b36");
  gradient.addColorStop(1,"#27354e");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  // Moon
  circle(365,112,39,"#e8e5d2");
  circle(382,99,35,"#101a34");

  // Stars
  for(let i=0;i<90;i++) {
    const x=(i*137+21)%W;
    const y=(i*71+19)%380;

    const glow=.35+.55*(.5+.5*Math.sin(t*1.4+i));

    rect(x,y,2,2,
      `rgba(220,232,255,${glow})`);
  }

  // Distant clouds
  for(let i=0;i<5;i++) {
    const x=((i*130-t*3)%(W+150)+W+150)%(W+150)-80;

    rect(x,180+i*35,75,5,"rgba(65,82,112,.13)");
  }
}

// =====================================
// 2. NEW YORK CITY
// =====================================

const buildings=[
  [0,330,60,470],
  [53,285,63,515],
  [110,350,50,450],
  [155,260,65,540],
  [216,320,55,480],
  [265,220,66,580],
  [325,300,62,500],
  [380,255,55,545],
  [430,345,50,455]
];

function drawCity() {
  buildings.forEach((b,i)=>{
    const [x,y,w,h]=b;

    rect(x,y,w,h,"#101a30");
    rect(x,y,w,5,"#293952");

    // Building rooftops
    if(i===3 || i===5) {
      rect(x+w/2-5,y-24,10,24,"#293b57");
      rect(x+w/2-2,y-44,4,20,"#42546e");
    }

    // Windows
    for(let yy=y+15;yy<y+h;yy+=21) {
      for(let xx=x+8;xx<x+w-5;xx+=15) {
        if((xx*3+yy*7+i)%6!==0) {
          const color=(xx+yy)%3===0
            ? "#d9b66d"
            : "#607da0";

          rect(xx,yy,6,9,color);
        }
      }
    }
  });
}

// =====================================
// 3. ROOFTOP
// =====================================

function drawRooftop() {
  // Building wall
  rect(0,555,W,245,"#111a2c");

  // Roof edge
  rect(0,547,W,10,"#65758a");
  rect(0,558,W,5,"#293952");

  // Rooftop structures
  rect(24,509,43,36,"#293951");
  rect(20,505,50,6,"#64758b");

  rect(104,518,37,27,"#283850");
  rect(100,514,45,5,"#61748c");

  // Windows
  for(let y=579;y<790;y+=34) {
    for(let x=18;x<465;x+=35) {
      rect(x,y,17,22,
        (x+y)%4===0?"#d2a65d":"#354967");
    }
  }
}

// =====================================
// 4. WEB ANCHORS
// =====================================

function drawAnchor(x,y) {
  // Attached to the building facade
  circle(x,y,6,"#263b58");
  circle(x,y,3,"#e8edf5");

  ctx.strokeStyle="#c5d4e8";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(x-9,y);
  ctx.lineTo(x+9,y);
  ctx.moveTo(x,y-9);
  ctx.lineTo(x,y+9);
  ctx.stroke();
}

function drawWeb(x1,y1,x2,y2) {
  // Dark outline
  ctx.strokeStyle="#53647c";
  ctx.lineWidth=3;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  // White web strand
  ctx.strokeStyle="#e5edf7";
  ctx.lineWidth=1.4;

  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  // Small web details
  for(let i=1;i<5;i++) {
    const p=i/5;
    const x=lerp(x1,x2,p);
    const y=lerp(y1,y2,p);

    rect(x-1,y-1,2,2,"#c4d5e9");
  }
}

// =====================================
// 5. SPIDER-MAN BODY
// =====================================

// Local coordinate:
// Head around -65
// Torso around -20
// Hip around 10

function drawSpider(pose,phase=0) {

  // ---------------------------------
  // LEGS
  // ---------------------------------

  if(pose==="sit") {

    // Thighs resting horizontally
    limb([-7,5],[-24,22],BLUE,12);
    limb([7,5],[24,22],BLUE,12);

    // Hanging lower legs
    const leftSwing=Math.sin(phase*1.5)*2.5;
    const rightSwing=Math.sin(phase*1.5+1.2)*2.5;

    limb(
      [-24,22],
      [-24+leftSwing,50],
      BLUE,10
    );

    limb(
      [24,22],
      [24+rightSwing,50],
      BLUE,10
    );

    // Boots
    polygon([
      [-29+leftSwing,47],
      [-17+leftSwing,47],
      [-13+leftSwing,57],
      [-31+leftSwing,57]
    ],RED);

    polygon([
      [17+rightSwing,47],
      [29+rightSwing,47],
      [32+rightSwing,57],
      [14+rightSwing,57]
    ],RED);

  }

  else if(pose==="land") {

    // Bent knees during landing
    limb([-7,5],[-19,23],BLUE,12);
    limb([7,5],[19,23],BLUE,12);

    limb([-19,23],[-28,39],BLUE,10);
    limb([19,23],[28,39],BLUE,10);

    polygon([
      [-32,35],[-21,35],[-17,44],[-35,45]
    ],RED);

    polygon([
      [21,35],[32,35],[35,44],[17,45]
    ],RED);

  }

  else {

    // Swinging legs
    limb([-7,5],[-19,24],BLUE,12);
    limb([-19,24],[-12,39],BLUE,10);

    limb([7,5],[22,18],BLUE,12);
    limb([22,18],[36,13],BLUE,10);

    polygon([
      [-17,34],[-7,34],[-3,44],[-18,45]
    ],RED);

    polygon([
      [31,8],[42,6],[45,15],[34,19]
    ],RED);
  }

  // ---------------------------------
  // TORSO
  // ---------------------------------

  polygon([
    [-11,-38],
    [11,-38],
    [17,-26],
    [14,5],
    [9,13],
    [-9,13],
    [-14,5],
    [-17,-26]
  ],RED);

  // Shoulder highlights
  polygon([
    [-15,-32],[-10,-29],[-10,-17],[-16,-19]
  ],LIGHT_RED,null);

  polygon([
    [15,-32],[10,-29],[10,-17],[16,-19]
  ],DARK_RED,null);

  // Blue side panels
  polygon([
    [-15,-20],[-10,-17],[-9,9],[-14,5]
  ],BLUE,null);

  polygon([
    [15,-20],[10,-17],[9,9],[14,5]
  ],BLUE,null);

  // Blue waist
  polygon([
    [-12,-5],[12,-5],[10,13],[-10,13]
  ],BLUE,null);

  // Spider emblem
  polygon([
    [0,-28],[-4,-21],[-3,-14],
    [0,-18],[3,-14],[4,-21]
  ],BLACK,null);

  limb([-2,-21],[-8,-25],BLACK,2);
  limb([2,-21],[8,-25],BLACK,2);
  limb([-2,-17],[-8,-12],BLACK,2);
  limb([2,-17],[8,-12],BLACK,2);

  // Web texture on chest
  ctx.strokeStyle="#761e2d";
  ctx.lineWidth=.8;

  for(let i=-12;i<=12;i+=6) {
    ctx.beginPath();
    ctx.moveTo(i,-34);
    ctx.lineTo(i*.7,5);
    ctx.stroke();
  }

  for(let y=-30;y<3;y+=8) {
    ctx.beginPath();
    ctx.moveTo(-13,y);
    ctx.lineTo(13,y);
    ctx.stroke();
  }

  // ---------------------------------
  // ARMS
  // ---------------------------------

  if(pose==="sit") {

    // Arms relaxed at the sides
    limb([-10,-27],[-21,-10],RED,9);
    limb([-21,-10],[-29,9],RED,8);

    limb([10,-27],[21,-10],RED,9);
    limb([21,-10],[29,9],RED,8);

    polygon([
      [-33,5],[-26,5],[-25,13],[-34,13]
    ],RED);

    polygon([
      [26,5],[33,5],[34,13],[25,13]
    ],RED);

  }

  else if(pose==="land") {

    // Arms extending slightly for balance
    limb([-10,-27],[-23,-10],RED,9);
    limb([-23,-10],[-29,4],RED,8);

    limb([10,-27],[23,-10],RED,9);
    limb([23,-10],[29,4],RED,8);

  }

  else {

    // Both arms raised
    limb([-10,-28],[-23,-43],RED,10);
    limb([-23,-43],[-29,-57],RED,9);

    limb([10,-28],[23,-43],RED,10);
    limb([23,-43],[29,-57],RED,9);

    polygon([
      [-34,-63],[-26,-63],[-24,-54],[-33,-52]
    ],RED);

    polygon([
      [26,-63],[34,-63],[34,-52],[26,-54]
    ],RED);
  }

  // ---------------------------------
  // HEAD / MASK
  // ---------------------------------

  polygon([
    [-11,-80],[-6,-85],[6,-85],
    [11,-80],[15,-67],[13,-49],
    [7,-40],[-7,-40],[-13,-49],[-15,-67]
  ],RED);

  // Mask highlights
  polygon([
    [-10,-77],[-5,-82],[0,-81],[-7,-68]
  ],LIGHT_RED,null);

  polygon([
    [10,-77],[5,-82],[0,-81],[7,-68]
  ],DARK_RED,null);

  // Eyes
  polygon([
    [-12,-67],[-5,-63],[-7,-55],[-14,-59]
  ],WHITE,BLACK,1.4);

  polygon([
    [12,-67],[5,-63],[7,-55],[14,-59]
  ],WHITE,BLACK,1.4);

  // Mask web texture
  ctx.strokeStyle="#721b2b";
  ctx.lineWidth=.9;

  for(let x=-10;x<=10;x+=5) {
    ctx.beginPath();
    ctx.moveTo(x,-79);
    ctx.lineTo(x*.7,-43);
    ctx.stroke();
  }

  for(let y=-74;y<-44;y+=7) {
    ctx.beginPath();
    ctx.moveTo(-12,y);
    ctx.lineTo(12,y);
    ctx.stroke();
  }

  // Mask horizontal web details
  ctx.beginPath();
  ctx.moveTo(-11,-65);
  ctx.lineTo(11,-65);
  ctx.moveTo(-9,-52);
  ctx.lineTo(9,-52);
  ctx.stroke();
}

// =====================================
// 6. CHARACTER POSITION
// =====================================

function drawHero(x,y,pose,angle=0,phase=0) {

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  drawSpider(pose,phase);

  ctx.restore();
}

// =====================================
// 7. WEB MOTION EFFECT
// =====================================

function drawMotion(x,y,angle) {
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);

  for(let i=1;i<=6;i++) {
    rect(
      -i*12,
      -5+i*2,
      9,
      2,
      `rgba(160,190,225,${.13-i*.017})`
    );
  }

  ctx.restore();
}

// =====================================
// 8. MAIN ANIMATION
// =====================================

const DURATION=10;

function animate(now) {

  const time=now/1000;
  const s=time%DURATION;

  // Background
  drawSky(time);
  drawCity();

  // Rooftop
  drawRooftop();

  // Fixed attachment points on building facades
  drawAnchor(420,350);
  drawAnchor(25,390);

  // ---------------------------------
  // PHASE 1: SITTING
  // 0 - 2.2 seconds
  // ---------------------------------

  if(s<2.2) {

    const breathing=Math.sin(time*2.4)*1.2;
    const headMovement=Math.sin(time*.8)*.8;

    drawHero(
      128,
      545+breathing,
      "sit",
      headMovement*.005,
      time
    );
  }

  // ---------------------------------
  // PHASE 2: PREPARING
  // 2.2 - 3 seconds
  // ---------------------------------

  else if(s<3) {

    const p=smooth((s-2.2)/.8);

    const x=lerp(128,145,p);
    const y=545-18*Math.sin(p*Math.PI/2);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-.18*p);
    drawSpider("land",time);
    ctx.restore();

  }

  // ---------------------------------
  // PHASE 3: SWING TO RIGHT
  // 3 - 4.4 seconds
  // ---------------------------------

  else if(s<4.4) {

    const p=smooth((s-3)/1.4);

    const x=lerp(145,565,p);
    const y=lerp(
      520,
      220,
      Math.sin(p*Math.PI/2)
    );

    const angle=lerp(-.3,-.9,p);

    // Cable connected to right building
    // and Spider-Man's raised hand
    drawWeb(
      420,
      350,
      x-29,
      y-57
    );

    drawMotion(x,y,angle);
    drawHero(x,y,"swing",angle,time);
  }

  // ---------------------------------
  // PHASE 4: OUTSIDE SCREEN
  // 4.4 - 5.7 seconds
  // ---------------------------------

  else if(s<5.7) {

    // Spider-Man is completely off-screen.
    // New York city remains visible.
  }

  // ---------------------------------
  // PHASE 5: RETURN FROM LEFT
  // 5.7 - 7.7 seconds
  // ---------------------------------

  else if(s<7.7) {

    const p=smooth((s-5.7)/2);

    const x=lerp(-100,128,p);
    const y=lerp(
      245,
      510,
      p
    )-110*Math.sin(Math.PI*p);

    const angle=lerp(.85,-.2,p);

    // Cable connected to left building
    drawWeb(
      25,
      390,
      x+29,
      y-57
    );

    drawMotion(x,y,angle);
    drawHero(x,y,"swing",angle,time);
  }

  // ---------------------------------
  // PHASE 6: LANDING
  // 7.7 - 8.4 seconds
  // ---------------------------------

  else if(s<8.4) {

    const p=smooth((s-7.7)/.7);

    const y=lerp(510,545,p);
    const angle=lerp(-.2,0,p);

    drawHero(
      128,
      y,
      "land",
      angle,
      time
    );
  }

  // ---------------------------------
  // PHASE 7: SITTING AGAIN
  // 8.4 - 10 seconds
  // ---------------------------------

  else {

    const p=smooth((s-8.4)/.5);

    const bounce=Math.sin((s-8.4)*12)*3*(1-p);

    drawHero(
      128,
      545+bounce,
      "sit",
      .01*(1-p),
      time
    );
  }

  // ---------------------------------
  // CINEMATIC VIGNETTE
  // ---------------------------------

  const vignette=ctx.createRadialGradient(
    240,380,160,
    240,380,510
  );

  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(1,"rgba(0,0,12,.48)");

  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>
</body>
</html>
